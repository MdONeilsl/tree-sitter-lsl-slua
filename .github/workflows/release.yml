name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            cli-arch: windows-x64
            archive-ext: zip
          - os: ubuntu-latest
            platform: linux-x64
            cli-arch: linux-x64
            archive-ext: tar.gz
          - os: macos-14        # arm64
            platform: macos-arm64
            cli-arch: macos-arm64
            archive-ext: tar.gz
          - os: macos-13        # x64
            platform: macos-x64
            cli-arch: macos-x64
            archive-ext: tar.gz

    steps:
      - uses: actions/checkout@v4

      # ---- Standalone tree-sitter CLI (no Node.js) ------------------
      - name: Download tree-sitter CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://github.com/tree-sitter/tree-sitter/releases/download/v0.27.2/tree-sitter-cli-${{ matrix.cli-arch }}.zip"
          Invoke-WebRequest -Uri $url -OutFile cli.zip
          Expand-Archive cli.zip -DestinationPath .
          $exe = Get-ChildItem -Recurse -Filter tree-sitter.exe | Select-Object -First 1
          if (-not $exe) { throw "tree-sitter.exe not found in archive" }
          Move-Item $exe.FullName "${{ github.workspace }}\tree-sitter.exe" -Force

      - name: Download tree-sitter CLI (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          URL="https://github.com/tree-sitter/tree-sitter/releases/download/v0.27.2/tree-sitter-cli-${{ matrix.cli-arch }}.zip"
          curl -fL "$URL" -o cli.zip
          python3 -m zipfile -e cli.zip .
          chmod +x tree-sitter

      - name: Verify CLI
        shell: bash
        run: ./tree-sitter --version || ./tree-sitter.exe --version

      # ---- Generate + build both grammars --------------------------
      - name: Generate and build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: scripts\generate-all.cmd

      - name: Generate and build (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/generate-all.sh

      # ---- Assemble dist -------------------------------------------
      - name: Assemble dist (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: scripts\assemble-dist.cmd

      - name: Assemble dist (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/assemble-dist.sh

      # ---- Create archive with top-level folder --------------------
      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "stage"
          $folder = "tree-sitter-lsl-slua-${{ matrix.platform }}"
          New-Item -ItemType Directory -Path $stage | Out-Null
          New-Item -ItemType Directory -Path "$stage\$folder" | Out-Null
          Copy-Item -Path "dist\*" -Destination "$stage\$folder" -Recurse
          Compress-Archive -Path "$stage\$folder" -DestinationPath "tree-sitter-lsl-slua-${{ matrix.platform }}.zip" -Force

      - name: Create archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          FOLDER="tree-sitter-lsl-slua-${{ matrix.platform }}"
          mv dist "$FOLDER"
          tar -czf "${FOLDER}.tar.gz" "$FOLDER"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: tree-sitter-lsl-slua-${{ matrix.platform }}.${{ matrix.archive-ext }}

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}