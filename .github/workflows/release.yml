name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:        # manual runs build + upload artifacts, but do NOT publish a release

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # ---- Standalone tree-sitter CLI (no Node.js) ------------------
      - name: Download tree-sitter CLI
        shell: pwsh
        run: |
          $url = "https://github.com/tree-sitter/tree-sitter/releases/download/v0.27.2/tree-sitter-cli-windows-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile tree-sitter-cli.zip
          Expand-Archive tree-sitter-cli.zip -DestinationPath ts-cli -Force
          $exe = Get-ChildItem -Path ts-cli -Recurse -Filter tree-sitter.exe | Select-Object -First 1
          if (-not $exe) { throw "tree-sitter.exe not found in downloaded archive" }
          Copy-Item $exe.FullName "${{ github.workspace }}\tree-sitter.exe"

      - name: Verify CLI
        shell: pwsh
        run: .\tree-sitter.exe --version

      # ---- LSL ------------------------------------------------------
      - name: Generate LSL parser
        shell: pwsh
        run: |
          python lsl\generate_lsl_grammar.py
          Push-Location lsl
          ..\tree-sitter.exe generate grammar.json
          Copy-Item grammar.json src\grammar.json -Force
          Pop-Location

      - name: Build LSL DLL
        shell: pwsh
        run: |
          Push-Location lsl
          ..\tree-sitter.exe build --output lsl.dll .
          Pop-Location

      # ---- SLua -----------------------------------------------------
      - name: Generate SLua parser
        shell: pwsh
        run: |
          python slua\generate_slua_grammar.py
          Push-Location slua
          ..\tree-sitter.exe generate grammar.json
          Copy-Item grammar.json src\grammar.json -Force
          Pop-Location

      - name: Build SLua DLL
        shell: pwsh
        run: |
          Push-Location slua
          ..\tree-sitter.exe build --output slua.dll .
          Pop-Location

      # ---- Sanity check before packaging ----------------------------
      - name: Verify both DLLs exist
        shell: pwsh
        run: |
          $lsl  = Test-Path "lsl\lsl.dll"
          $slua = Test-Path "slua\slua.dll"
          Write-Host "lsl\lsl.dll  present = $lsl"
          Write-Host "slua\slua.dll present = $slua"
          if (-not ($lsl -and $slua)) {
            throw "One or more DLLs missing. Assemble-dist would fail next."
          }

      # ---- Package --------------------------------------------------
      - name: Assemble dist
        shell: cmd
        run: scripts\assemble-dist.cmd

      - name: Create zip
        shell: pwsh
        run: Compress-Archive -Path dist\* -DestinationPath tree-sitter-lsl-lsua-windows-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: tree-sitter-lsl-lsua-windows-x64.zip

  publish:
    needs: build-windows
    # Only publish when the workflow was triggered by a v* tag.
    # workflow_dispatch runs build + upload artifacts, but stop here.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/windows-x64/tree-sitter-lsl-lsua-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}